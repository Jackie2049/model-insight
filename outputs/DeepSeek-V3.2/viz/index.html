<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeepSeek-V3.2 · 算子流水</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft Yahei",sans-serif;color:#292722;background:#f8f7f4;--panel:#f2f0eb;--panel2:#ebe8e1;--line:#e2ded6;--muted:#77736c;--accent:#c56a45;--accent-soft:#f4e7df;--good:#39745c;--warn:#a66a26}
*{box-sizing:border-box}body{margin:0;min-height:100vh}button,a{font:inherit}button{cursor:pointer}a{color:inherit}.app{display:grid;grid-template-columns:292px minmax(0,1fr);height:100vh;min-height:580px}.rail{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:22px 17px}.brand{display:flex;align-items:center;gap:9px;font-size:11px;letter-spacing:.09em;font-weight:750;color:#716d66;text-transform:uppercase}.mark{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;background:#d97850;color:#fff;font-size:14px;letter-spacing:0}.rail h1{font-size:22px;line-height:1.2;letter-spacing:-.035em;margin:22px 0 8px;font-weight:650}.subtle{color:var(--muted);font-size:12px;line-height:1.55}.section{margin-top:27px}.section-head{display:flex;align-items:center;justify-content:space-between;color:#77736c;font-size:10px;letter-spacing:.08em;font-weight:700;text-transform:uppercase;margin-bottom:9px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px}.tab,.item{border:1px solid transparent;background:transparent;color:#383630;border-radius:9px}.tab{padding:10px 7px;font-size:13px;font-weight:600}.tab:hover,.item:hover{background:#eae7e0}.tab.active,.item.active{border-color:#e6c6b6;background:#f5e8e1;color:#7d4029;box-shadow:none}.tab small{display:block;font-size:10px;color:#8f786b;font-weight:450;margin-top:3px}.items{display:grid;gap:3px}.item{text-align:left;padding:9px 10px;display:flex;align-items:center;gap:10px;width:100%}.n{flex:0 0 27px;height:27px;border-radius:8px;display:grid;place-items:center;background:#e8e5de;color:#706b62;font-size:12px;font-weight:650}.item.active .n{background:#e6c7b7;color:#87462e}.item strong{display:block;font-size:12px;font-weight:600}.item small{display:block;color:var(--muted);font-size:10px;margin-top:3px;line-height:1.25}.count{margin-left:auto;color:#8a857c;font-size:10px;white-space:nowrap}.empty{color:var(--muted);font-size:12px;border:1px dashed #d7d1c7;padding:12px;border-radius:9px}.main{min-width:0;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:17px 23px;border-bottom:1px solid var(--line);min-height:78px;background:#fbfaf8}.eyebrow{color:#a85a3b;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}.heading{display:flex;align-items:center;gap:10px;margin-top:5px;flex-wrap:wrap}.heading h2{font-size:17px;margin:0;font-weight:620}.pill{border:1px solid #e2ded6;color:#77736c;border-radius:50px;padding:3px 8px;font-size:10px}.topactions{display:flex;gap:7px;flex-shrink:0}.action{background:#c56a45;color:white;border:1px solid #c56a45;border-radius:8px;text-decoration:none;padding:8px 11px;font-size:11px}.action:hover{background:#ad5938}.action.secondary{background:transparent;color:#57534d;border-color:#ddd8cf}.action.secondary:hover{background:#f0eee9}.context{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:10px 23px;border-bottom:1px solid var(--line);color:#6e6961;font-size:11px;min-height:45px;background:#fbfaf8}.context .warning{color:var(--warn)}.context .good{color:var(--good)}.framewrap{position:relative;flex:1;min-height:0;background:#f0f1f2}.framewrap iframe{width:100%;height:100%;border:0;background:white}.loading{position:absolute;z-index:1;inset:0;display:grid;place-items:center;background:#f0f1f2;color:#686d72;font-size:13px}.loading[hidden]{display:none}.foot{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 23px;border-top:1px solid var(--line);font-size:10px;color:var(--muted);background:#fbfaf8}.foot a{color:#9e573b;text-decoration:none}.focused .rail{display:none}.focused .app{grid-template-columns:1fr}@media(max-width:850px){.app{grid-template-columns:1fr;height:auto;min-height:100vh}.rail{border-right:0;border-bottom:1px solid var(--line);max-height:290px;padding:14px}.rail h1{font-size:18px;margin:10px 0 3px}.rail .section{margin-top:14px}.items{grid-template-columns:repeat(2,minmax(0,1fr))}.item{padding:8px}.main{height:calc(100vh - 260px);min-height:450px}.top{padding:10px}.context,.foot{padding:8px 10px}.action{padding:7px}.topactions{gap:4px}}
</style>
</head>
<body>
<div class="app">
<aside class="rail" aria-label="视图导航">
  <div class="brand"><span class="mark">◈</span> Model-Insight</div>
  <h1>DeepSeek-V3.2<br>算子流水</h1>
  <section class="section"><div class="section-head">01 · 运行场景</div><div class="tabs" id="scenarios"></div></section>
  <section class="section"><div class="section-head">02 · 整模型观察尺度 <span id="depthCount"></span></div><div class="items" id="depths"></div></section>
  <section class="section"><div class="section-head">03 · 专项模块实验</div><div class="items" id="modules"></div></section>
</aside>
<main class="main">
  <header class="top"><div><div class="eyebrow" id="breadcrumb">OPERATOR FLOW</div><div class="heading"><h2 id="viewTitle">加载中</h2><span class="pill" id="viewType"></span></div></div><div class="topactions"><button class="action secondary" id="focusBtn" type="button">专注视图</button><a class="action" id="standalone" href="#" target="_blank" rel="noopener">单独打开 ↗</a></div></header>
  <div class="context"><span id="viewDescription"></span><span id="viewEvidence"></span></div>
  <div class="framewrap"><div class="loading" id="loading">正在加载 TorchVista 交互图…</div><iframe id="graph" title="TorchVista 算子图" loading="eager"></iframe></div>
  <footer class="foot"><span>基于现有 TorchVista 页面 · 轻量融合 IR 独立保存</span><span><a href="../fusion/final_ir.json" target="_blank" rel="noopener">查看分析 JSON ↗</a>　·　<a href="README.md" target="_blank" rel="noopener">图集说明 ↗</a></span></footer>
</main></div>
<script>
const VIEWS=[{"id": "macro_prefill_d0", "file": "macro_prefill_d0.html", "kind": "macro", "scenario": "prefill", "depth": 0, "target": null, "title": "模型骨架", "nodes": 20, "status": "ok", "rebuild": true}, {"id": "macro_prefill_d1", "file": "macro_prefill_d1.html", "kind": "macro", "scenario": "prefill", "depth": 1, "target": null, "title": "层内主链", "nodes": 48, "status": "ok", "rebuild": true}, {"id": "macro_prefill_d2", "file": "macro_prefill_d2.html", "kind": "macro", "scenario": "prefill", "depth": 2, "target": null, "title": "功能模块", "nodes": 555, "status": "ok", "rebuild": true}, {"id": "macro_prefill_d3", "file": "macro_prefill_d3.html", "kind": "macro", "scenario": "prefill", "depth": 3, "target": null, "title": "内部运算", "nodes": 1623, "status": "ok", "rebuild": true}, {"id": "macro_decode_d0", "file": "macro_decode_d0.html", "kind": "macro", "scenario": "decode", "depth": 0, "target": null, "title": "模型骨架", "nodes": 17, "status": "ok", "rebuild": false}, {"id": "macro_decode_d1", "file": "macro_decode_d1.html", "kind": "macro", "scenario": "decode", "depth": 1, "target": null, "title": "层内主链", "nodes": 45, "status": "ok", "rebuild": true}, {"id": "macro_decode_d2", "file": "macro_decode_d2.html", "kind": "macro", "scenario": "decode", "depth": 2, "target": null, "title": "功能模块", "nodes": 644, "status": "ok", "rebuild": true}, {"id": "macro_decode_d3", "file": "macro_decode_d3.html", "kind": "macro", "scenario": "decode", "depth": 3, "target": null, "title": "内部运算", "nodes": 1692, "status": "ok", "rebuild": true}, {"id": "macro_prefill_d4", "file": "macro_prefill_d4.html", "kind": "macro", "scenario": "prefill", "depth": 4, "target": null, "title": "算子细节", "nodes": 3817, "status": "ok", "rebuild": true}, {"id": "macro_decode_d4", "file": "macro_decode_d4.html", "kind": "macro", "scenario": "decode", "depth": 4, "target": null, "title": "算子细节", "nodes": 3658, "status": "ok", "rebuild": true}, {"id": "micro_dense_block", "file": "micro_dense_block.html", "kind": "micro", "scenario": "prefill", "depth": 0, "target": "layers.0", "title": "layers.0", "nodes": 11, "status": "ok", "rebuild": true}, {"id": "micro_moe_block", "file": "micro_moe_block.html", "kind": "micro", "scenario": "prefill", "depth": 0, "target": "layers.3", "title": "layers.3", "nodes": 11, "status": "ok", "rebuild": true}, {"id": "micro_mla_attn", "file": "micro_mla_attn.html", "kind": "micro", "scenario": "prefill", "depth": 0, "target": "layers.0.attn", "title": "layers.0.attn", "nodes": 115, "status": "ok", "rebuild": true}];
const DETAILS={"depth0": {"title": "模型骨架", "description": "Embedding → Block → Norm → Head", "long": "先看整个模型的主数据流与层级边界。"}, "depth1": {"title": "层内主链", "description": "Attention、FFN、Norm", "long": "展开每层的注意力、前馈和归一化模块。"}, "depth2": {"title": "功能模块", "description": "MLA、Indexer、Gate 与 Experts", "long": "查看 Attention 子模块、MoE 路由及相关计算。"}, "depth3": {"title": "内部运算", "description": "Linear、Quantization 与 Expert 实例", "long": "查看 Linear projection、Quantization 与 Expert execution 的细节。"}, "depth4": {"title": "算子细节", "description": "全部可见调用点", "long": "显示最细粒度算子，图较大，初次加载可能需要等待。"}, "micro_dense_block": {"title": "Dense Block", "description": "layers.0 · 独立输入", "long": "使用单独构造的输入捕获 Dense Block；与整模型视图分别产生。"}, "micro_moe_block": {"title": "MoE Block", "description": "layers.3 · 独立输入", "long": "使用单独构造的输入观察 MoE Block；Expert token count 取决于当前实验输入。"}, "micro_mla_attn": {"title": "MLA Attention", "description": "layers.0.attn · 独立输入", "long": "使用单独构造的输入观察 MLA 与 DSA Indexer 运算。"}};
const $=id=>document.getElementById(id);
const byId=Object.fromEntries(VIEWS.map(v=>[v.id,v]));
let scene='prefill', selected='', focused=false;
function hashState(){const q=new URLSearchParams(location.hash.slice(1));return {scene:q.get('scene'),view:q.get('view')};}
function setHash(v){history.replaceState(null,'','#scene='+encodeURIComponent(v.scenario)+'&view='+encodeURIComponent(v.id));}
function choose(id){const v=byId[id];if(!v)return;scene=v.scenario;selected=id;setHash(v);render();}
function sceneButton(s){const labels={prefill:['Prefill','B=1 · S=64'],decode:['Decode','B=1 · S=1']};const b=document.createElement('button');b.type='button';b.className='tab'+(scene===s?' active':'');b.innerHTML='<span>'+labels[s][0]+'</span><small>'+labels[s][1]+'</small>';b.onclick=()=>{const old=byId[selected];const preferred=old&&old.kind==='macro'?VIEWS.find(v=>v.kind==='macro'&&v.scenario===s&&v.depth===old.depth):null;choose((preferred||VIEWS.find(v=>v.kind==='macro'&&v.scenario===s&&v.depth===0)).id)};return b;}
function viewButton(v){const b=document.createElement('button');b.type='button';b.className='item'+(selected===v.id?' active':'');const micro=v.kind==='micro';let title=micro?(DETAILS[v.id]?.title||v.target||v.id):('D'+v.depth+' · '+(DETAILS['depth'+v.depth]?.title||v.title));let subtitle=micro?(DETAILS[v.id]?.description||v.target):DETAILS['depth'+v.depth]?.description;b.innerHTML='<span class="n">'+(micro?'◇':v.depth)+'</span><span><strong>'+title+'</strong><small>'+subtitle+'</small></span><span class="count">'+(v.nodes??'—')+'</span>';b.onclick=()=>choose(v.id);return b;}
function render(){const v=byId[selected];if(!v)return;$('scenarios').replaceChildren(sceneButton('prefill'),sceneButton('decode'));const macros=VIEWS.filter(x=>x.kind==='macro'&&x.scenario===scene).sort((a,b)=>a.depth-b.depth);$('depthCount').textContent=macros.length+' 张';$('depths').replaceChildren(...macros.map(viewButton));const micros=VIEWS.filter(x=>x.kind==='micro'&&x.scenario===scene);$('modules').replaceChildren(...(micros.length?micros.map(viewButton):[(()=>{const e=document.createElement('div');e.className='empty';e.textContent='当前场景没有单独的模块实验图；可在整模型视图逐级查看。';return e;})()]));const info=DETAILS[v.id]||DETAILS['depth'+v.depth]||{};const micro=v.kind==='micro';$('breadcrumb').textContent=(scene==='prefill'?'Prefill':'Decode')+' / '+(micro?'模块实验':'整模型')+' / '+(micro?v.target:'D'+v.depth);$('viewTitle').textContent=micro?(info.title||v.target):('D'+v.depth+' · '+(info.title||v.title));$('viewType').textContent=micro?'独立模块输入':'整模型捕获';$('viewDescription').textContent=info.long||info.description||'';$('viewEvidence').textContent=(v.nodes??'—')+' 节点 · '+(v.status==='ok'?'抓图成功':'状态 '+v.status);$('viewEvidence').className=v.status==='ok'?'good':'warning';$('standalone').href=v.file;const frame=$('graph');if(frame.getAttribute('src')!==v.file){$('loading').hidden=false;frame.src=v.file;}}
$('graph').addEventListener('load',()=>{ $('loading').hidden=true; try{const panel=$('graph').contentDocument.getElementById('ops-kit-fusion-injection');if(panel)panel.classList.add('ops-kit-collapsed');}catch(e){} });
$('focusBtn').onclick=()=>{focused=!focused;document.body.classList.toggle('focused',focused);$('focusBtn').textContent=focused?'显示导航':'专注视图';};
window.addEventListener('hashchange',()=>{const h=hashState();if(byId[h.view]){scene=byId[h.view].scenario;selected=h.view;render();}});
const h=hashState();selected=byId[h.view]?h.view:(VIEWS.find(v=>v.id==='macro_prefill_d0')||VIEWS[0]).id;scene=byId[selected].scenario;setHash(byId[selected]);render();
</script>
</body></html>
