<style>

*{box-sizing:border-box}body{margin:0;min-height:100vh}button,a{font:inherit}button{cursor:pointer}a{color:inherit}.app{display:grid;grid-template-columns:292px minmax(0,1fr);height:100vh;min-height:580px}.rail{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:22px 17px}.brand{display:flex;align-items:center;gap:9px;font-size:11px;letter-spacing:.09em;font-weight:750;color:#9aa3b5;text-transform:uppercase}.mark{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;background:var(--accent);color:#fff;font-size:14px;letter-spacing:0}.rail h1{font-size:22px;line-height:1.2;letter-spacing:-.035em;margin:22px 0 8px;font-weight:650;color:#f2f4f8}.subtle{color:var(--muted);font-size:12px;line-height:1.55}.section{margin-top:27px}.section-head{display:flex;align-items:center;justify-content:space-between;color:#7a8294;font-size:10px;letter-spacing:.08em;font-weight:700;text-transform:uppercase;margin-bottom:9px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px}.tab,.item{border:1px solid transparent;background:transparent;color:#c8cdd8;border-radius:9px}.tab{padding:10px 7px;font-size:13px;font-weight:600}.tab:hover,.item:hover{background:#232833}.tab.active,.item.active{border-color:rgba(91,140,255,.45);background:var(--blue-soft);color:#a9c2ff;box-shadow:none}.tab small{display:block;font-size:10px;color:#6d7686;font-weight:450;margin-top:3px}.items{display:grid;gap:3px}.item{text-align:left;padding:9px 10px;display:flex;align-items:center;gap:10px;width:100%}.n{flex:0 0 27px;height:27px;border-radius:8px;display:grid;place-items:center;background:#262b34;color:#a8b0c0;font-size:12px;font-weight:650}.item.active .n{background:rgba(91,140,255,.28);color:#cddcff}.item strong{display:block;font-size:12px;font-weight:600}.item small{display:block;color:var(--muted);font-size:10px;margin-top:3px;line-height:1.25}.count{margin-left:auto;color:#6d7686;font-size:10px;white-space:nowrap}.empty{color:var(--muted);font-size:12px;border:1px dashed #3a404c;padding:12px;border-radius:9px}.stats{display:grid;gap:5px}.stat{display:flex;align-items:center;gap:7px;font-size:11px;color:#b6bdc9}.stat b{font-weight:650}.dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}.note{margin-top:9px;font-size:10px;line-height:1.5;color:var(--muted);cursor:help}.main{min-width:0;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:17px 23px;border-bottom:1px solid var(--line);min-height:78px;background:#1b1f27}.eyebrow{color:var(--accent);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}.heading{display:flex;align-items:center;gap:10px;margin-top:5px;flex-wrap:wrap}.heading h2{font-size:17px;margin:0;font-weight:620;color:#f2f4f8}.pill{border:1px solid var(--line);color:var(--muted);border-radius:50px;padding:3px 8px;font-size:10px}.topactions{display:flex;gap:7px;flex-shrink:0}.action{background:var(--blue);color:white;border:1px solid var(--blue);border-radius:8px;text-decoration:none;padding:8px 11px;font-size:11px}.action:hover{background:#6f9aff}.action.secondary{background:transparent;color:#b6bdc9;border-color:#343a46}.action.secondary:hover{background:#232833}.context{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:10px 23px;border-bottom:1px solid var(--line);color:#9aa3b5;font-size:11px;min-height:45px;background:#1b1f27}.context .warning{color:var(--warn)}.context .good{color:var(--good)}.framewrap{position:relative;flex:1;min-height:0;background:#0f1115}.framewrap iframe{width:100%;height:100%;border:0;background:white}.loading{position:absolute;z-index:1;inset:0;display:grid;place-items:center;background:#0f1115;color:#7a8294;font-size:13px}.loading[hidden]{display:none}.foot{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 23px;border-top:1px solid var(--line);font-size:10px;color:#6d7686;background:#1b1f27}.foot a{color:var(--accent);text-decoration:none}.focused .rail{display:none}.focused .app{grid-template-columns:1fr}@media(max-width:850px){.app{grid-template-columns:1fr;height:auto;min-height:100vh}.rail{border-right:0;border-bottom:1px solid var(--line);max-height:290px;padding:14px}.rail h1{font-size:18px;margin:10px 0 3px}.rail .section{margin-top:14px}.items{grid-template-columns:repeat(2,minmax(0,1fr))}.item{padding:8px}.main{height:calc(100vh - 260px);min-height:450px}.top{padding:10px}.context,.foot{padding:8px 10px}.action{padding:7px}.topactions{gap:4px}}

<body>
<div class="app">
<aside class="rail" aria-label="视图导航">
  <div class="brand"><span class="mark">◈</span> Model-Insight</div>
  <h1>DeepSeek-V3.2<br>算子流水</h1>
  <div class="subtle">从模型骨架到算子细节，在同一入口查看不同场景与观察尺度。</div>
  <section class="section"><div class="section-head">01 · 运行场景</div><div class="tabs" id="scenarios"></div></section>
  <section class="section"><div class="section-head">02 · 整模型观察尺度 <span id="depthCount"></span></div><div class="items" id="depths"></div></section>
  <section class="section"><div class="section-head">03 · 专项模块实验</div><div class="items" id="modules"></div></section>
  <section class="section"><div class="section-head">04 · 分析摘要</div><div id="summary"></div></section>
</aside>
<main class="main">
  <header class="top"><div><div class="eyebrow" id="breadcrumb">OPERATOR FLOW</div><div class="heading"><h2 id="viewTitle">加载中</h2><span class="pill" id="viewType"></span></div></div><div class="topactions"><button class="action secondary" id="focusBtn" type="button">专注视图</button><a class="action" id="standalone" href="#" target="_blank" rel="noopener">单独打开 ↗</a></div></header>
  <div class="context"><span id="viewDescription"></span><span id="viewEvidence"></span></div>
  <div class="framewrap"><div class="loading" id="loading">正在加载 TorchVista 交互图…</div><iframe id="graph" title="TorchVista 算子图" loading="eager"></iframe></div>
  <footer class="foot"><span>基于现有 TorchVista 页面 · 轻量融合 IR 独立保存</span><span><a href="../fusion/final_ir.json" target="_blank" rel="noopener">查看分析 JSON ↗</a>　·　<a href="README.md" target="_blank" rel="noopener">图集说明 ↗</a></span></footer>
</main></div>
<script>
const VIEWS=[{"id":"macro_prefill_d0","file":"macro_prefill_d0.html","kind":"macro","scenario":"prefill","depth":0,"target":null,"title":"模型骨架","nodes":20,"status":"ok"},{"id":"macro_prefill_d1","file":"macro_prefill_d1.html","kind":"macro","scenario":"prefill","depth":1,"target":null,"title":"层内主链","nodes":48,"status":"ok"},{"id":"macro_prefill_d2","file":"macro_prefill_d2.html","kind":"macro","scenario":"prefill","depth":2,"target":null,"title":"功能模块","nodes":555,"status":"ok"},{"id":"macro_prefill_d3","file":"macro_prefill_d3.html","kind":"macro","scenario":"prefill","depth":3,"target":null,"title":"内部运算","nodes":1623,"status":"ok"},{"id":"macro_decode_d0","file":"macro_decode_d0.html","kind":"macro","scenario":"decode","depth":0,"target":null,"title":"模型骨架","nodes":17,"status":"ok"},{"id":"macro_decode_d1","file":"macro_decode_d1.html","kind":"macro","scenario":"decode","depth":1,"target":null,"title":"层内主链","nodes":45,"status":"ok"},{"id":"macro_decode_d2","file":"macro_decode_d2.html","kind":"macro","scenario":"decode","depth":2,"target":null,"title":"功能模块","nodes":644,"status":"ok"},{"id":"macro_decode_d3","file":"macro_decode_d3.html","kind":"macro","scenario":"decode","depth":3,"target":null,"title":"内部运算","nodes":1692,"status":"ok"},{"id":"macro_prefill_d4","file":"macro_prefill_d4.html","kind":"macro","scenario":"prefill","depth":4,"target":null,"title":"算子细节","nodes":3817,"status":"ok"},{"id":"macro_decode_d4","file":"macro_decode_d4.html","kind":"macro","scenario":"decode","depth":4,"target":null,"title":"算子细节","nodes":3658,"status":"ok"},{"id":"micro_dense_block","file":"micro_dense_block.html","kind":"micro","scenario":"prefill","depth":0,"target":"layers.0","title":"layers.0","nodes":11,"status":"ok"},{"id":"micro_moe_block","file":"micro_moe_block.html","kind":"micro","scenario":"prefill","depth":0,"target":"layers.3","title":"layers.3","nodes":11,"status":"ok"},{"id":"micro_mla_attn","file":"micro_mla_attn.html","kind":"micro","scenario":"prefill","depth":0,"target":"layers.0.attn","title":"layers.0.attn","nodes":115,"status":"ok"}];
const DETAILS={"depth0":{"title":"模型骨架","description":"Embedding → Block → Norm → Head","long":"先看整个模型的主数据流与层级边界。"},"depth1":{"title":"层内主链","description":"Attention、FFN、Norm","long":"展开每层的注意力、前馈和归一化模块。"},"depth2":{"title":"功能模块","description":"层内各功能子模块","long":"查看注意力子模块、前馈、门控与专家等计算构成。"},"depth3":{"title":"内部运算","description":"线性层与逐算子计算点","long":"查看子模块内部的计算点与张量形状。"},"depth4":{"title":"算子细节","description":"全部可见调用点","long":"显示最细粒度算子，图较大，初次加载可能需要等待。"},"micro_dense_block":{"title":"layers.0","description":"独立输入捕获","long":"使用单独构造的输入捕获 layers.0；与整模型视图分别产生。"},"micro_moe_block":{"title":"layers.3","description":"独立输入捕获","long":"使用单独构造的输入捕获 layers.3；与整模型视图分别产生。"},"micro_mla_attn":{"title":"layers.0.attn","description":"独立输入捕获","long":"使用单独构造的输入捕获 layers.0.attn；与整模型视图分别产生。"}};
const SUMMARY={"statuses":{"verified":66,"mismatch":1,"llm_only":1,"capture_only":0,"conflict":0},"totalNodes":68,"replacementCount":4,"replacementsFull":"· kernel.act_quant（tilelang 实现，毛坯 inference/kernel.py L87-111 fn + L36-84 kernel）\n· kernel.fp8_gemm（tilelang 实现，毛坯 inference/kernel.py L171-196 fn + L114-168 kernel）\n· kernel.fp8_index（tilelang 实现，毛坯 inference/kernel.py L254-274 fn + L199-251 kernel）\n· fast_hadamard_transform.hadamard_transform（CUDA 库，model.py L428-432 rotate_activation 内延迟 import，L472-473 对 Indexer q/k 调用）","scaleNote":"分支维度保真、规模维度缩水（不冒充全量）。671B 全量 → 抓图实例化对照：vocab_size 129280→1024；n_layers 61→4（层 0-2 稠密 + 层 3 MoE，保留真实层型边界）；n_heads 128→8（头结构不变：nope 128 / rop…"};
const STATUS_META=[["verified","已验证","#4cc38a"],["mismatch","不一致","#e0a35c"],["llm_only","仅推导","#8b93a3"],["capture_only","仅捕获","#8b93a3"],["conflict","冲突","#e06c5c"]];
const $=id=>document.getElementById(id);
const byId=Object.fromEntries(VIEWS.map(v=>[v.id,v]));
const SCENARIOS=[...new Set(VIEWS.map(v=>v.scenario))].map(s=>({key:s,label:s.charAt(0).toUpperCase()+s.slice(1).replace(/_/g,' '),count:VIEWS.filter(v=>v.scenario===s).length}));
let scene=SCENARIOS[0].key, selected='', focused=false;
function hashState(){const q=new URLSearchParams(location.hash.slice(1));return {scene:q.get('scene'),view:q.get('view')};}
function setHash(v){history.replaceState(null,'','#scene='+encodeURIComponent(v.scenario)+'&view='+encodeURIComponent(v.id));}
function choose(id){const v=byId[id];if(!v)return;scene=v.scenario;selected=id;setHash(v);render();}
function sceneLabel(s){const m=SCENARIOS.find(x=>x.key===s);return m?m.label:s;}
function sceneButton(s){const meta=SCENARIOS.find(x=>x.key===s);const b=document.createElement('button');b.type='button';b.className='tab'+(scene===s?' active':'');b.innerHTML='<span>'+meta.label+'</span><small>'+meta.count+' 个视图</small>';b.onclick=()=>{const old=byId[selected];const preferred=old&&old.kind==='macro'?VIEWS.find(v=>v.kind==='macro'&&v.scenario===s&&v.depth===old.depth):null;const target=preferred||VIEWS.find(v=>v.kind==='macro'&&v.scenario===s)||VIEWS.find(v=>v.scenario===s);choose(target.id)};return b;}
function macroTitle(v){return v.depth==null?v.title:('D'+v.depth+' · '+(DETAILS['depth'+v.depth]?.title||v.title));}
function viewButton(v){const b=document.createElement('button');b.type='button';b.className='item'+(selected===v.id?' active':'');const micro=v.kind==='micro';const title=micro?(DETAILS[v.id]?.title||v.target||v.id):macroTitle(v);const subtitle=micro?(DETAILS[v.id]?.description||v.target):(DETAILS['depth'+v.depth]?.description||'');const badge=micro?'◇':(v.depth==null?'◆':v.depth);b.innerHTML='<span class="n">'+badge+'</span><span><strong>'+title+'</strong><small>'+subtitle+'</small></span><span class="count">'+(v.nodes??'—')+'</span>';b.onclick=()=>choose(v.id);return b;}
function renderSummary(){const box=$('summary');const stats=document.createElement('div');stats.className='stats';for(const [k,zh,color] of STATUS_META){const n=SUMMARY.statuses[k]||0;const row=document.createElement('div');row.className='stat';if(!n)row.style.opacity='.45';row.innerHTML='<span class="dot" style="background:'+color+'"></span><b>'+n+'</b><span>'+zh+'</span>';stats.appendChild(row);}const note=document.createElement('div');note.className='note';note.textContent='替换件 '+SUMMARY.replacementCount+' 个 · '+SUMMARY.scaleNote;note.title=SUMMARY.replacementsFull||'';box.replaceChildren(stats,note);}
function render(){const v=byId[selected];if(!v)return;$('scenarios').replaceChildren(...SCENARIOS.map(x=>sceneButton(x.key)));const macros=VIEWS.filter(x=>x.kind==='macro'&&x.scenario===scene).sort((a,b)=>(a.depth??99)-(b.depth??99));$('depthCount').textContent=macros.length+' 张';$('depths').replaceChildren(...macros.map(viewButton));const micros=VIEWS.filter(x=>x.kind==='micro'&&x.scenario===scene);$('modules').replaceChildren(...(micros.length?micros.map(viewButton):[(()=>{const e=document.createElement('div');e.className='empty';e.textContent='当前场景没有单独的模块实验图；可在整模型视图逐级查看。';return e;})()]));const info=DETAILS[v.id]||DETAILS['depth'+v.depth]||{};const micro=v.kind==='micro';$('breadcrumb').textContent=sceneLabel(scene)+' / '+(micro?'模块实验':'整模型')+' / '+(micro?v.target:(v.depth==null?'整模型':'D'+v.depth));$('viewTitle').textContent=micro?(info.title||v.target):macroTitle(v);$('viewType').textContent=micro?'独立模块输入':'整模型捕获';$('viewDescription').textContent=info.long||info.description||'';$('viewEvidence').textContent=(v.nodes??'—')+' 节点 · '+(v.status==='ok'?'抓图成功':'状态 '+v.status);$('viewEvidence').className=v.status==='ok'?'good':'warning';$('standalone').href=v.file;const frame=$('graph');if(frame.getAttribute('src')!==v.file){$('loading').hidden=false;frame.src=v.file;}}
$('graph').addEventListener('load',()=>{ $('loading').hidden=true; try{const panel=$('graph').contentDocument.getElementById('ops-kit-fusion-injection');if(panel)panel.classList.add('ops-kit-collapsed');}catch(e){} });
$('focusBtn').onclick=()=>{focused=!focused;document.body.classList.toggle('focused',focused);$('focusBtn').textContent=focused?'显示导航':'专注视图';};
window.addEventListener('hashchange',()=>{const h=hashState();if(byId[h.view]){scene=byId[h.view].scenario;selected=h.view;render();}});
const h=hashState();selected=byId[h.view]?h.view:(VIEWS.find(v=>v.kind==='macro'&&v.status==='ok')||VIEWS.find(v=>v.status==='ok')||VIEWS[0]).id;scene=byId[selected].scenario;setHash(byId[selected]);render();renderSummary();
</script>
